#:schema https://www.schemastore.org/prek.json
# prek's native configuration (https://prek.j178.dev/configuration/). The builtin repo
# already makes this setup prek-only, so there is no pre-commit config to stay compatible
# with. Plain TOML 1.0 tables, so Python's tomllib can read the file.

# Vendored skills and agents are copied verbatim (see .claude/skills/VENDORED.md);
# docs/_freeze/ is generated by Quarto and must match what a build writes.
exclude = '^(\.claude/(skills|agents)/|docs/_freeze/)'

# Hygiene hooks implemented inside prek: offline, nothing to download.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=600"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--show-fixes"]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/Mateusz-Grzelinski/actionlint-py"
rev = "v1.7.12.25"

[[repos.hooks]]
id = "actionlint"

[[repos]]
repo = "local"

# The project's own uv, not astral-sh/uv-pre-commit: that hook installs uv==<rev> in its
# own environment, a second uv version beside [tool.uv] required-version. Run as a system
# command, `uv lock` is the uv that required-version already checks, so pyproject.toml is
# the one place the uv version lives.
[[repos.hooks]]
id = "uv-lock"
name = "uv lock"
entry = "uv lock"
language = "system"
files = '^(uv\.lock|pyproject\.toml)$'
pass_filenames = false

# Advisory, not a commit blocker: run with `uv run task repo-review`.
[[repos.hooks]]
id = "repo-review"
name = "sp-repo-review"
entry = "uvx 'sp-repo-review[cli]' ."
language = "system"
pass_filenames = false
stages = ["manual"]
