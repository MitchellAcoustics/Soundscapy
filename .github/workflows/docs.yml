name: CI Docs

# Builds every version listed under `versions:` in docs/great-docs.yml: the
# `latest` release is served at the site root (API reference from its git tag),
# `dev` (main) under /v/dev/. Pushes to main publish to GitHub Pages; PR builds
# log a `great-docs preview --pr <N>` command for viewing the site locally.
# release.yml calls this with `deploy: false` as a build gate.

on:
  workflow_call:
    inputs:
      deploy:
        description: "Publish the built site to GitHub Pages (main only)"
        type: boolean
        default: true
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # In a called workflow, github.workflow is the caller's name, so the release
  # gate never queues behind (or cancels) the standalone deploy run.
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Full history + tags: page timestamps and `git_ref` versions

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.81.0
          environments: docs

      # API snapshots introspected from each version's git tag. Tags are
      # immutable, so the cache only goes stale when the versions list changes.
      - name: Cache versioned API snapshots
        uses: actions/cache@v6.1.0
        with:
          path: docs/.cache/snapshots
          key: gd-snapshots-${{ hashFiles('docs/great-docs.yml') }}
          restore-keys: gd-snapshots-

      - name: Build docs
        run: pixi run docs-build # same command as local; task defaults to the docs env

      - name: Save docs artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-html
          path: docs/_site
          include-hidden-files: true

      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        run: pixi run -e docs great-docs ci notice --run ${{ github.run_id }} --pr ${{ github.event.number }}

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    # Skip publishing only when the caller explicitly supplies boolean false.
    if: github.ref == 'refs/heads/main' && toJSON(inputs.deploy) != 'false'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: docs-html
          path: docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
