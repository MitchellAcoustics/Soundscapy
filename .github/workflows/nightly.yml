# Spec design/specs/2026-10-31-phase0-m1-design.md §5.6.2: reference and network tests, the
# paper re-execution with a freeze-diff check, and the user-facing quick-start scripts run
# end to end on clean runners. Scheduled and manual runs start from the default branch
# only, and the default branch is still `main` (the previous codebase), so until the rewrite
# becomes the default branch the jobs run on pushes to soundscapy-rewrite that touch the
# files they exercise.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [soundscapy-rewrite]
    paths:
      - .github/workflows/nightly.yml
      - docs/user_guide/_quickstart.*
      - docs/papers/**
      - tests/**/test_*network*
      - tests/**/test_*reference*

permissions:
  contents: read

# Every uv command asserts that uv.lock is current, including the `uv run` calls inside
# Taskfile.yml. The quickstart job turns it off: its scripts create projects with `uv add`.
env:
  UV_LOCKED: "1"

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Point the pooch data directory at a cached path
        run: echo "SOUNDSCAPY_DATA_DIR=$HOME/.cache/soundscapy-data" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/soundscapy-data
          key: soundscapy-data-reference-${{ hashFiles('src/soundscapy/**/registry*') || 'no-registry' }}
          restore-keys: soundscapy-data-reference-
      - name: Install go-task (Taskfile.yml's version is the minimum it accepts)
        shell: bash
        run: |
          uv tool install go-task-bin
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: task test:reference

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Point the pooch data directory at a cached path
        run: echo "SOUNDSCAPY_DATA_DIR=$HOME/.cache/soundscapy-data" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/soundscapy-data
          key: soundscapy-data-network-${{ hashFiles('src/soundscapy/**/registry*') || 'no-registry' }}
          restore-keys: soundscapy-data-network-
      - name: Install go-task (Taskfile.yml's version is the minimum it accepts)
        shell: bash
        run: |
          uv tool install go-task-bin
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: task test:network

  docs-papers:
    # Re-executes the frozen paper pages, then opens an issue when docs/_freeze changed.
    # The one job that writes (spec §5.6.2).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Point the pooch data directory at a cached path
        run: echo "SOUNDSCAPY_DATA_DIR=$HOME/.cache/soundscapy-data" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/soundscapy-data
          key: soundscapy-data-papers-${{ hashFiles('src/soundscapy/**/registry*') || 'no-registry' }}
          restore-keys: soundscapy-data-papers-
      - name: Install go-task (Taskfile.yml's version is the minimum it accepts)
        shell: bash
        run: |
          uv tool install go-task-bin
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: uv sync --group docs
      - name: Re-execute the paper pages
        # Guarded until the first paper page lands; the freeze-diff step below still runs.
        run: |
          if [ ! -f docs/papers/2022-how-to-analyse.qmd ]; then
            echo "no paper page yet; skipping"
            exit 0
          fi
          task docs:papers
      - name: Open an issue if docs/_freeze changed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # --intent-to-add makes new, untracked freeze entries show up in the diff too.
          git add --intent-to-add docs/_freeze
          if git diff --quiet docs/_freeze; then
            echo "docs/_freeze unchanged"
            exit 0
          fi
          git diff --stat docs/_freeze
          title="Nightly: re-executed paper pages changed docs/_freeze"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "An open issue already reports this; not opening another."
            exit 0
          fi
          {
            echo "The nightly \`task docs:papers\` run re-executed the paper pages and their"
            echo "frozen output no longer matches \`docs/_freeze\`."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            git diff --stat docs/_freeze
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"

  quickstart:
    # The user-facing install scripts end to end on a clean runner with only uv, each in a
    # fresh temporary directory; on ubuntu also the one-cell hosted-notebook install (NFR-1).
    name: quickstart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      UV_LOCKED: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, to find the newest release tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Choose the soundscapy requirement
        # Before the first release, when soundscapy==1.0.0.dev1 is not on PyPI, override the
        # scripts' requirement with the git URL of the newest rewrite tag (v1 and later; the
        # v0.x tags belong to the previous codebase), or of this commit while no tag exists.
        # After the release SOUNDSCAPY_SPEC stays unset and the scripts run unchanged.
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          # 200: released; 404: not yet released; anything else is a PyPI or network fault,
          # which fails the job rather than silently testing the wrong requirement.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://pypi.org/pypi/soundscapy/1.0.0.dev1/json)
          case "$code" in
            200)
              echo "soundscapy==1.0.0.dev1 is on PyPI; the scripts run unchanged."
              exit 0
              ;;
            404) ;;
            *)
              echo "PyPI check failed with HTTP status '$code'" >&2
              exit 1
              ;;
          esac
          tag=$(git tag --list 'v[1-9]*' --sort=-v:refname | head -n 1)
          ref="${tag:-$SHA}"
          spec="soundscapy @ git+https://github.com/MitchellAcoustics/Soundscapy@$ref"
          echo "Using $spec"
          echo "SOUNDSCAPY_SPEC=$spec" >> "$GITHUB_ENV"
      - name: Run _quickstart.sh in a fresh directory
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir=$(mktemp -d "$RUNNER_TEMP/quickstart.XXXXXX")
          cp docs/user_guide/_quickstart.sh docs/user_guide/_quickstart.py "$dir/"
          cd "$dir"
          sh _quickstart.sh
      - name: Run _quickstart.ps1 in a fresh directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "quickstart-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item docs/user_guide/_quickstart.ps1, docs/user_guide/_quickstart.py -Destination $dir
          Set-Location $dir
          # The command the install page gives (Windows PowerShell 5.1).
          powershell -ExecutionPolicy Bypass -File _quickstart.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the hosted-notebook pip cell in a fresh venv
        # What a notebook's `%pip install 'soundscapy==1.0.0.dev1'` cell runs, then the first-run code.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir=$(mktemp -d "$RUNNER_TEMP/pipcell.XXXXXX")
          cp docs/user_guide/_quickstart.py "$dir/"
          cd "$dir"
          uv venv --seed .venv
          .venv/bin/python -m pip install "${SOUNDSCAPY_SPEC:-soundscapy==1.0.0.dev1}"
          .venv/bin/python _quickstart.py
