# Spec design/specs/2026-10-31-phase0-m1-design.md §5.6.1. Every job runs the same `task`
# targets developers run. Actions are pinned by commit SHA with the tag in a comment.
name: CI

on:
  push:
    branches: [soundscapy-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every uv command asserts that uv.lock is current, including the `uv run` calls inside
# Taskfile.yml. The `lowest` job turns it off, because it must re-resolve.
env:
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; every push to the branch keeps its own complete record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install go-task (Taskfile.yml's version is the minimum it accepts)
        shell: bash
        run: |
          uv tool install go-task-bin
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: task check

  lowest:
    # Proves the runtime floors of spec §6.19. The variable, not a `--resolution` flag, keeps
    # the later `uv run` from re-resolving to the newest versions (spec §5.6.1).
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: lowest-direct
      UV_LOCKED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      # --resolution highest: the job's lowest-direct resolution must not pick an old go-task.
      - name: Install go-task (Taskfile.yml's version is the minimum it accepts)
        shell: bash
        run: |
          uv tool install --resolution highest go-task-bin
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: uv sync
      - name: Print the installed direct dependency versions
        run: uv tree --depth 1
      - run: task test

  docs:
    # ubuntu x 3.14 is the canonical platform for frozen output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install go-task (Taskfile.yml's version is the minimum it accepts)
        shell: bash
        run: |
          uv tool install go-task-bin
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: uv sync --group docs
      - name: Build the docs with no network
        # `task docs` must run offline (spec §5.9): the paper pages stay frozen and tutorials
        # use bundled data. The build runs in a new network namespace with only loopback up
        # (the Jupyter kernel talks TCP on 127.0.0.1; without lo it times out after 60 s, see
        # house-style reference.md §4), dropped back to the runner user. UV_OFFLINE stops uv
        # from trying to re-resolve. sudo resets PATH, so the runner's PATH is passed through.
        env:
          UV_OFFLINE: "1"
        run: |
          sudo --preserve-env unshare --net -- sh -c '
            ip link set lo up &&
            if curl -s --max-time 5 -o /dev/null https://pypi.org; then
              echo "the network is reachable inside the namespace" >&2
              exit 1
            fi &&
            exec sudo --preserve-env -u "$1" env PATH="$2" task docs
          ' sh "$(id -un)" "$PATH"
      - name: Fail if a page's freeze is stale
        # --intent-to-add makes new, untracked freeze entries show up in the diff too.
        run: |
          git add --intent-to-add docs/_freeze
          git diff --exit-code docs/_freeze

  hooks:
    # The prek hooks over the whole tree, as a contributor's commit would run them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          # prek's own version comes from uv.lock, and the cache depends on it too.
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml', 'uv.lock') }}
      - run: uv run prek run --all-files --show-diff-on-failure

  citation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Validate CITATION.cff against schema 1.2.0
        run: uvx cffconvert@2.0.0 --validate

  install:
    # Covers Windows and macOS for installation, import and the quick-start script (NFR-1).
    # The windows-11-arm cell uses x64 Python, which runs emulated and installs win_amd64
    # wheels: the route a course participant on a Windows Arm laptop takes. Native arm64
    # Python is not tested (pyarrow ships no win_arm64 wheel). That cell records the state
    # rather than gating, because emulated runs on a new runner image are not yet a stable
    # signal (spec §5.6.1).
    name: install (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
        include:
          - os: windows-11-arm
            python: "3.13"
            arch: x86_64
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          python-arch: ${{ matrix.arch }}
          enable-cache: true
      - run: uv build
      - name: Install the wheel in a fresh venv
        # bash, so the *.whl glob expands on Windows too (PowerShell passes it literally).
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/install-venv"
          uv pip install --python "$RUNNER_TEMP/install-venv" --only-binary :all: dist/*.whl
      - name: Import soundscapy and run the quick-start script
        # Runs outside the checkout so nothing is imported from the source tree.
        # `soundscapy --version` is added here from M1 slice S8, when the CLI arrives.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            py="$RUNNER_TEMP/install-venv/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/install-venv/bin/python"
          fi
          "$py" -c "import platform, sys; print(sys.version, platform.machine())"
          cd "$RUNNER_TEMP"
          "$py" -c "import soundscapy"
          "$py" "$GITHUB_WORKSPACE/docs/user_guide/_quickstart.py"
      - name: Parse _quickstart.ps1 with PowerShell 7 and Windows PowerShell 5.1 (no execution)
        # The install page tells users to run the script with `powershell`, i.e. 5.1.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parse = {
            $errors = $null
            $path = (Resolve-Path 'docs/user_guide/_quickstart.ps1').Path
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
            if ($errors) { $errors; exit 1 }
          }
          & $parse
          powershell -NoProfile -Command $parse
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
