# Spec design/specs/2026-10-31-phase0-m1-design.md §5.6.1. Every job runs the same `task`
# targets developers run. Actions are pinned by commit SHA with the tag in a comment.
name: CI

on:
  push:
    branches: [soundscapy-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run task check

  lowest:
    # Proves the runtime floors of spec §6.19. The variable, not a `--resolution` flag, keeps
    # the later `uv run` from re-resolving to the newest versions (spec §5.6.1).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - name: Print the installed direct dependency versions
        run: uv tree --depth 1
      - run: uv run task test

  docs:
    # ubuntu x 3.14 is the canonical platform for frozen output.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run task docs
      - name: Fail if a page's freeze is stale
        # --intent-to-add makes new, untracked freeze entries show up in the diff too.
        run: |
          git add --intent-to-add docs/_freeze
          git diff --exit-code docs/_freeze

  citation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Validate CITATION.cff against schema 1.2.0
        run: uvx cffconvert@2.0.0 --validate

  install:
    # Covers Windows and macOS for installation, import and the quick-start script (NFR-1).
    name: install (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv build
      - name: Install the wheel in a fresh venv
        # bash, so the *.whl glob expands on Windows too (PowerShell passes it literally).
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/install-venv"
          uv pip install --python "$RUNNER_TEMP/install-venv" --only-binary :all: dist/*.whl
      - name: Import soundscapy and run the quick-start script
        # Runs outside the checkout so nothing is imported from the source tree.
        # `soundscapy --version` is added here from M1 slice S8, when the CLI arrives.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            py="$RUNNER_TEMP/install-venv/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/install-venv/bin/python"
          fi
          cd "$RUNNER_TEMP"
          "$py" -c "import soundscapy"
          "$py" "$GITHUB_WORKSPACE/docs/user_guide/_quickstart.py"
      - name: Parse _quickstart.ps1 with PowerShell 7 (no execution)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $path = (Resolve-Path 'docs/user_guide/_quickstart.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
      - name: Parse _quickstart.ps1 with Windows PowerShell 5.1 (no execution)
        # The install page tells users to run the script with `powershell`, i.e. 5.1.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          $path = (Resolve-Path 'docs/user_guide/_quickstart.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }

  install-win-arm:
    # The `install` steps on a Windows Arm runner with x64 Python, which runs emulated and
    # installs win_amd64 wheels: the route a course participant on a Windows Arm laptop takes.
    # Native arm64 Python is not tested (pyarrow ships no win_arm64 wheel). It records the
    # state rather than gating, because emulated runs on a new runner image are not yet a
    # stable signal (spec §5.6.1).
    runs-on: windows-11-arm
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          python-arch: x86_64
          enable-cache: true
      - run: uv build
      - name: Install the wheel in a fresh venv
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/install-venv"
          uv pip install --python "$RUNNER_TEMP/install-venv" --only-binary :all: dist/*.whl
      - name: Import soundscapy and run the quick-start script
        # `soundscapy --version` is added here from M1 slice S8, when the CLI arrives.
        shell: bash
        run: |
          py="$RUNNER_TEMP/install-venv/Scripts/python.exe"
          "$py" -c "import platform, sys; print(sys.version, platform.machine())"
          cd "$RUNNER_TEMP"
          "$py" -c "import soundscapy"
          "$py" "$GITHUB_WORKSPACE/docs/user_guide/_quickstart.py"
      - name: Parse _quickstart.ps1 with PowerShell 7 (no execution)
        shell: pwsh
        run: |
          $errors = $null
          $path = (Resolve-Path 'docs/user_guide/_quickstart.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
      - name: Parse _quickstart.ps1 with Windows PowerShell 5.1 (no execution)
        shell: powershell
        run: |
          $errors = $null
          $path = (Resolve-Path 'docs/user_guide/_quickstart.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
