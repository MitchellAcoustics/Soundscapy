name: Prek checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: linting-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.81.0
          cache: true
          # auth-host: prefix.dev
          # auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}
          frozen: true
          environments: "default"

      - name: Run Prek checks
        uses: j178/prek-action@v3.0.1
        with:
          prek-version: 0.5.5 # match local pixi env
