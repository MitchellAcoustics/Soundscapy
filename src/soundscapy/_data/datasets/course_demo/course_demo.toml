notes = "Renamed extract of the ISD used in the IoA soundscape course (examples/data/DemoData.csv on soundscapy 0.x main): the ISD 1.0.1-alpha.1 rows of CamdenTown, MarchmontGarden, PancrasLock and TateModern through the four-part key, less PancrasLock/PancrasLock2/PL202/410 and TateModern/TateModern1/TM124/663. All versions: concept DOI 10.5281/zenodo.5578572. free_response, ISOPleasant and ISOEventful dropped; other cells unchanged. The file has no language column: the ISD records 454 rows as eng and 2 as spa (CamdenTown/CamdenTown3/CT323/10009 and 10010); the mapping sets eng for all. Made by scripts/make_course_demo.py."
