notes = "Written by hand from design/literature/mitchell-et-al-2026-satp-chapter-4-notes.md, transcribed from the author proof dated 2026-08-13; to be checked against the published chapter. Tiers: Table 4.7, p. 19. Angles: Table 4.8, p. 20 (equal-communality CircE model, PAQ1 fixed at 0 degrees), which lists the 13 High languages only. cmn passed Step 2 and moved to Medium because of Step 3; its SEM results and angles are identical to Aletta et al. (2024)'s (section 4.6.1, p. 24), so its angles are those of aletta-2024@1. The other Medium and the Low languages have no published angles."

