# Generated files that should not be reformatted by any hook
exclude: |
  (?x)^(
    environment\.yml |
    docs/_quarto/.*|
    docs/_site/.*|
    docs/_freeze/.*|
    docs/\.cache/.*
  )$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # TODO(MitchellAcoustics): Enable linting pre-commit hooks
      # https://github.com/MitchellAcoustics/Soundscapy/issues/114
      - id: ruff
        exclude: ^test/.*\.py$
      - id: ruff-format
  # - repo: https://github.com/facebook/pyrefly-pre-commit
  #   rev: 1.3.2 # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  #   hooks:
  #     - id: pyrefly-check
  #       name: Pyrefly (type checking)
  #       pass_filenames: true # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
  #       language: system # Use system-installed pyrefly
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
        args:
          - --dot
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
      - id: remove-tabs

  # TODO(MitchellAcoustics): Enable linting pre-commit hooks
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        args:
          - --quote-props=as-needed
        # pixi.lock is machine-written; reformatting it fights `pixi lock`.
        exclude: ^(CITATION\.cff|pixi\.lock)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
        exclude: ^CITATION\.cff$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.2"
    hooks:
      - id: check-github-issue-forms
        files: ^\.github/ISSUE_TEMPLATE/.*\.yml$
        exclude: ^\.github/ISSUE_TEMPLATE/config\.yml$
      - id: check-github-issue-config
        files: ^\.github/ISSUE_TEMPLATE/config\.yml$
      - id: check-github-workflows
        files: ^\.github/workflows/.*\.yml$
      - id: check-github-actions
        files: (^action\.yml$)|(^\.github/actions/.*/action\.yml$)
  - repo: https://github.com/eznix86/python-license
    rev: v1.2.2
    hooks:
      - id: license-headers
        args: [
            "--fix",
            "--dir",
            "src/soundscapy",
            # Positionals last: prek appends filenames, which argparse only
            # binds to `files` if no option sits between them and `author`.
            "BSD-3-Clause",
            "Andrew Mitchell",
          ]
        # Without this, prek also passes every staged file (e.g. Dockerfiles).
        files: ^src/soundscapy/.*\.py$
  - repo: local
    hooks:
      - id: updatecitation
        name: updateCitation
        entry: updateCitation
        language: python
        additional_dependencies:
          - updateCitation
        # Only regenerate when citation metadata could have changed.
        files: ^(pyproject\.toml|CITATION\.cff)$
        pass_filenames: false
