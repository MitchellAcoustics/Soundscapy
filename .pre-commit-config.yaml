repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # Vendored skills and agents are copied verbatim (see .claude/skills/VENDORED.md).
        exclude: ^\.claude/(skills|agents)/
      - id: end-of-file-fixer
        # Vendored skills and agents are copied verbatim (see .claude/skills/VENDORED.md).
        exclude: ^\.claude/(skills|agents)/
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: repo-review
        name: sp-repo-review
        entry: uvx 'sp-repo-review[cli]' .
        language: system
        pass_filenames: false
        stages: [manual]
