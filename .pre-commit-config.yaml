# Generated files that should not be reformatted by any hook
exclude: |
  (?x)^(
    environment\.yml |
    docs/_quarto/.*|
    docs/_site/.*|
    docs/_freeze/.*|
    docs/\.cache/.*
  )$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # TODO(MitchellAcoustics): Enable linting pre-commit hooks
      # https://github.com/MitchellAcoustics/Soundscapy/issues/114
      - id: ruff
        exclude: ^test/.*\.py$
      - id: ruff-format
  # - repo: https://github.com/facebook/pyrefly-pre-commit
  #   rev: 1.3.2 # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  #   hooks:
  #     - id: pyrefly-check
  #       name: Pyrefly (type checking)
  #       pass_filenames: true # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
  #       language: system # Use system-installed pyrefly
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint-fix
        args:
          - --dot
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-tabs
      - id: remove-tabs

  # TODO(MitchellAcoustics): Enable linting pre-commit hooks
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.5.3
    hooks:
      - id: prettier
        args:
          - --quote-props=as-needed
        exclude: ^CITATION\.cff$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
        exclude: ^CITATION\.cff$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-github-issue-forms
        files: ^\.github/ISSUE_TEMPLATE/.*\.yml$
        exclude: ^\.github/ISSUE_TEMPLATE/config\.yml$
      - id: check-github-issue-config
        files: ^\.github/ISSUE_TEMPLATE/config\.yml$
      - id: check-github-workflows
        files: ^\.github/workflows/.*\.yml$
      - id: check-github-actions
        files: (^action\.yml$)|(^\.github/actions/.*/action\.yml$)
  - repo: https://github.com/eznix86/python-license
    rev: v1.0.1
    hooks:
      - id: license-headers
        args:
          [
            "--fix",
            "BSD-3-Clause",
            "Andrew Mitchell",
            "--dir",
            "src/soundscapy",
          ]
  - repo: local
    hooks:
      - id: updatecitation
        name: updateCitation
        entry: updateCitation
        language: python
        additional_dependencies:
          - updateCitation
        files: ^$
        pass_filenames: false
        always_run: true
