schema = "soundscapy.mapping"
schema_version = 1
instrument = "iso-12913-outdoor"
instrument_version = "1"
age = "age00"
carry = ["start_time", "Survey_Version"]

[ids]
response_key = ["LocationID", "SessionID", "GroupID", "RecordID"]
location = "LocationID"
session = "SessionID"
group = "GroupID"
record = "RecordID"

[language]
column = "Language"

[groups.attributes.columns]
pleasant = "pleasant"
vibrant = "vibrant"
eventful = "eventful"
chaotic = "chaotic"
annoying = "annoying"
monotonous = "monotonous"
uneventful = "uneventful"
calm = "calm"

[groups.attributes.coding]
reverse = ["calm"]

[groups.source_dominance.columns]
traffic_noise = "ssi01"
other_noise = "ssi02"
human_sounds = "ssi03"
natural_sounds = "ssi04"

[groups.overall_quality.columns]
overall_quality = "sss01"

[groups.overall_quality.coding.value_map]
"Strongly disagree" = 1.0
"Somewhat disagree" = 2.0
Neutral = 3.0
"Somewhat agree" = 4.0
"Strongly agree" = 5.0

[groups.appropriateness.columns]
appropriateness = "sss02"

[groups.who5.columns]
who5_1 = "who01"
who5_2 = "who02"
who5_3 = "who03"
who5_4 = "who04"
who5_5 = "who05"

[groups.who5.scale]
minimum = 1.0
maximum = 6.0
kind = "interval"

[flags.consent]
column = "consent"
true_values = ["yes"]

[flags.test]
column = "test"
true_values = ["yes"]

[flags.paper_input]
column = "paper"
true_values = ["yes"]
